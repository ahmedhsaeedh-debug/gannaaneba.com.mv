services:
  - type: web
    name: gannaaneba
    runtime: python
    plan: 0.5c-512mb
    region: singapore
    buildCommand: python -m py_compile app.py
    startCommand: python app.py
    healthCheckPath: /api/config
    disk:
      name: gannaaneba-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: ADMIN_USER_ID
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_PATH
        value: /var/data/gannaaneba.db
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: COOKIE_SECURE
        value: "1"
